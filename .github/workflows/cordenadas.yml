package com.coordscapture

import android.content.Intent
import android.graphics.Color
import android.net.Uri
import android.os.Build
import android.os.Bundle
import android.provider.Settings
import android.view.Gravity
import android.widget.LinearLayout
import android.widget.TextView
import android.widget.Toast
import androidx.appcompat.app.AppCompatActivity
import com.google.android.material.button.MaterialButton

class MainActivity : AppCompatActivity() {

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)

        val root = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setBackgroundColor(Color.BLACK) // AMOLED puro #000000
            gravity = Gravity.CENTER
            setPadding(48, 48, 48, 48)
        }

        val title = TextView(this).apply {
            text = "COORDS\nAMOLED"
            setTextColor(Color.WHITE)
            textSize = 28f
            gravity = Gravity.CENTER
            setPadding(0,0,0,60)
            letterSpacing = 0.1f
        }

        val subtitle = TextView(this).apply {
            text = "Fondo negro puro\nPrecisión al pixel\nFormato X=540 Y=543"
            setTextColor(Color.parseColor("#AAAAAA"))
            textSize = 14f
            gravity = Gravity.CENTER
            setPadding(0,0,0,80)
        }

        val last = getLastCoord()
        val tvLast = TextView(this).apply {
            text = if (last.isNotEmpty()) "Último: $last" else "Sin capturas aún"
            setTextColor(Color.parseColor("#666666"))
            textSize = 12f
            gravity = Gravity.CENTER
            setPadding(0,0,0,40)
        }

        val btn = MaterialButton(this).apply {
            text = "ESCANEAR"
            textSize = 18f
            setTextColor(Color.WHITE)
            setBackgroundColor(Color.parseColor("#222222"))
            cornerRadius = 24
            setPadding(80, 40, 80, 40)
            strokeWidth = 2
            strokeColor = android.content.res.ColorStateList.valueOf(Color.parseColor("#333333"))
            setOnClickListener {
                if (!Settings.canDrawOverlays(this@MainActivity)) {
                    Toast.makeText(this@MainActivity, "Activa 'Mostrar sobre otras apps'", Toast.LENGTH_LONG).show()
                    val intent = Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                    startActivity(intent)
                    return@setOnClickListener
                }
                val i = Intent(this@MainActivity, CaptureService::class.java).apply { action = "START" }
                if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                Toast.makeText(this@MainActivity, "Botón flotante activo - minimizando", Toast.LENGTH_SHORT).show()
                moveTaskToBack(true)
            }
        }

        val hint = TextView(this).apply {
            text = "\n\nInstrucciones:\n1. ESCANEAR\n2. Mueve el botón flotante donde no estorbe\n3. Toca el punto exacto → copia X=... Y=...\n4. Toca el flotante para pausar/reanudar"
            setTextColor(Color.parseColor("#555555"))
            textSize = 11f
            gravity = Gravity.CENTER
        }

        root.addView(title)
        root.addView(subtitle)
        root.addView(tvLast)
        root.addView(btn)
        root.addView(hint)

        setContentView(root)
    }

    private fun getLastCoord(): String {
        return getSharedPreferences("coords", MODE_PRIVATE).getString("last", "") ?: ""
    }

    override fun onResume() {
        super.onResume()
        // refrescar último al volver
        setContentView(findViewById<LinearLayout>(android.R.id.content).getChildAt(0))
        recreate()
    }
}
