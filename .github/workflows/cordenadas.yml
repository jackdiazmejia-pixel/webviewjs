package com.coordscapture

import android.app.Notification
import android.app.NotificationChannel
import android.app.NotificationManager
import android.app.Service
import android.content.ClipData
import android.content.ClipboardManager
import android.content.Context
import android.content.Intent
import android.graphics.Color
import android.graphics.PixelFormat
import android.os.Build
import android.os.IBinder
import android.os.VibrationEffect
import android.os.Vibrator
import android.view.Gravity
import android.view.MotionEvent
import android.view.View
import android.view.WindowManager
import android.widget.FrameLayout
import android.widget.TextView
import android.widget.Toast
import androidx.core.app.NotificationCompat

class CaptureService : Service() {

    private var wm: WindowManager? = null
    private var floatingBtn: View? = null
    private var captureOverlay: View? = null
    private var coordView: TextView? = null
    private var isScanning = true

    private var initialX = 0
    private var initialY = 0
    private var initialTouchX = 0f
    private var initialTouchY = 0f
    private var isDragging = false

    override fun onBind(intent: Intent?): IBinder? = null

    override fun onCreate() {
        super.onCreate()
        wm = getSystemService(WINDOW_SERVICE) as WindowManager
        startForegroundNotification()
    }

    override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
        if (intent?.action == "STOP") {
            stopSelf()
            return START_NOT_STICKY
        }
        showAll()
        return START_STICKY
    }

    private fun startForegroundNotification() {
        val channelId = "coords_channel"
        if (Build.VERSION.SDK_INT >= 26) {
            val channel = NotificationChannel(channelId, "Coords", NotificationManager.IMPORTANCE_LOW)
            channel.setShowBadge(false)
            (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(channel)
        }
        val notif: Notification = NotificationCompat.Builder(this, channelId)
            .setContentTitle("Coords AMOLED activo")
            .setContentText("Toca la pantalla para capturar X=... Y=...")
            .setSmallIcon(android.R.drawable.ic_menu_mylocation)
            .setOngoing(true)
            .build()
        startForeground(1, notif)
    }

    private fun showAll() {
        // limpiar por si ya existe
        removeAll()

        // 1. Overlay de captura a pantalla completa (debajo del boton)
        val captureParams = WindowManager.LayoutParams(
            WindowManager.LayoutParams.MATCH_PARENT,
            WindowManager.LayoutParams.MATCH_PARENT,
            if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
            PixelFormat.TRANSLUCENT
        )
        val captureRoot = FrameLayout(this).apply {
            setBackgroundColor(Color.parseColor("#01000000")) // totalmente transparente pero captura toques
            setOnTouchListener { _, ev ->
                if (!isScanning) return@setOnTouchListener false
                if (ev.action == MotionEvent.ACTION_DOWN) {
                    // PRECISIÓN PERFECTA: rawX/rawY = coordenadas absolutas de pantalla
                    val x = ev.rawX.toInt()
                    val y = ev.rawY.toInt()
                    val formatted = "X=$x Y=$y"
                    saveAndCopy(formatted)
                    showCoord(formatted, x, y)
                    vibrate()
                    // No propagar al app de abajo cuando estamos escaneando
                    return@setOnTouchListener true
                }
                true
            }
        }
        wm?.addView(captureRoot, captureParams)
        captureOverlay = captureRoot

        // 2. Vista de coordenada actual (arriba centro)
        val coordParams = WindowManager.LayoutParams(
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.WRAP_CONTENT,
            if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
            PixelFormat.TRANSLUCENT
        ).apply {
            gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL
            y = 120
        }
        val tv = TextView(this).apply {
            text = "TOCA UN PUNTO"
            setTextColor(Color.WHITE)
            textSize = 13f
            setBackgroundColor(Color.BLACK) // AMOLED puro
            setPadding(24, 12, 24, 12)
        }
        wm?.addView(tv, coordParams)
        coordView = tv

        // 3. Botón flotante movible
        val btnParams = WindowManager.LayoutParams(
            WindowManager.LayoutParams.WRAP_CONTENT,
            WindowManager.LayoutParams.WRAP_CONTENT,
            if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
            WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
            PixelFormat.TRANSLUCENT
        ).apply {
            gravity = Gravity.TOP or Gravity.START
            x = 100
            y = 400
        }
        val btn = TextView(this).apply {
            text = "ESCANEANDO"
            setTextColor(Color.WHITE)
            textSize = 12f
            setBackgroundColor(Color.parseColor("#222222"))
            setPadding(32, 20, 32, 20)
            // borde sutil
        }

        btn.setOnTouchListener { v, event ->
            when (event.action) {
                MotionEvent.ACTION_DOWN -> {
                    initialX = btnParams.x
                    initialY = btnParams.y
                    initialTouchX = event.rawX
                    initialTouchY = event.rawY
                    isDragging = false
                    true
                }
                MotionEvent.ACTION_MOVE -> {
                    val dx = (event.rawX - initialTouchX).toInt()
                    val dy = (event.rawY - initialTouchY).toInt()
                    if (kotlin.math.abs(dx) > 10 || kotlin.math.abs(dy) > 10) {
                        isDragging = true
                        btnParams.x = initialX + dx
                        btnParams.y = initialY + dy
                        wm?.updateViewLayout(v, btnParams)
                    }
                    true
                }
                MotionEvent.ACTION_UP -> {
                    if (!isDragging) {
                        // click -> toggle
                        toggleScanning()
                    }
                    isDragging = false
                    true
                }
                else -> false
            }
        }

        wm?.addView(btn, btnParams)
        floatingBtn = btn
        isScanning = true
    }

    private fun toggleScanning() {
        isScanning = !isScanning
        val btn = floatingBtn as? TextView ?: return
        if (isScanning) {
            btn.text = "ESCANEANDO"
            btn.setBackgroundColor(Color.parseColor("#222222"))
            // mostrar captura de nuevo si se quitó
            if (captureOverlay == null) {
                // recrear solo overlay de captura
                val captureParams = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.MATCH_PARENT,
                    WindowManager.LayoutParams.MATCH_PARENT,
                    if (Build.VERSION.SDK_INT >= 26) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                    PixelFormat.TRANSLUCENT
                )
                val captureRoot = FrameLayout(this).apply {
                    setBackgroundColor(Color.parseColor("#01000000"))
                    setOnTouchListener { _, ev ->
                        if (!isScanning) return@setOnTouchListener false
                        if (ev.action == MotionEvent.ACTION_DOWN) {
                            val x = ev.rawX.toInt()
                            val y = ev.rawY.toInt()
                            val formatted = "X=$x Y=$y"
                            saveAndCopy(formatted)
                            showCoord(formatted, x, y)
                            vibrate()
                            return@setOnTouchListener true
                        }
                        true
                    }
                }
                wm?.addView(captureRoot, captureParams)
                captureOverlay = captureRoot
                coordView?.visibility = View.VISIBLE
            }
            Toast.makeText(this, "ESCANEANDO activado", Toast.LENGTH_SHORT).show()
        } else {
            btn.text = "DETENIDO"
            btn.setBackgroundColor(Color.parseColor("#880000"))
            // quitar overlay de captura para poder usar el teléfono normal
            captureOverlay?.let { try { wm?.removeView(it) } catch (_: Exception) {} }
            captureOverlay = null
            coordView?.visibility = View.GONE
            Toast.makeText(this, "DETENIDO - toca de nuevo para escanear", Toast.LENGTH_SHORT).show()
        }
    }

    private fun showCoord(formatted: String, x: Int, y: Int) {
        coordView?.text = formatted
        coordView?.visibility = View.VISIBLE
        Toast.makeText(this, "$formatted - COPIADO", Toast.LENGTH_SHORT).show()
    }

    private fun saveAndCopy(formatted: String) {
        // guardar
        getSharedPreferences("coords", MODE_PRIVATE).edit().putString("last", formatted).apply()
        // copiar al portapapeles
        val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
        cm.setPrimaryClip(ClipData.newPlainText("coords", formatted))
    }

    private fun vibrate() {
        try {
            val v = getSystemService(VIBRATOR_SERVICE) as Vibrator
            if (Build.VERSION.SDK_INT >= 26) {
                v.vibrate(VibrationEffect.createOneShot(40, VibrationEffect.DEFAULT_AMPLITUDE))
            } else {
                @Suppress("DEPRECATION")
                v.vibrate(40)
            }
        } catch (_: Exception) {}
    }

    private fun removeAll() {
        try { floatingBtn?.let { wm?.removeView(it) } } catch (_: Exception) {}
        try { captureOverlay?.let { wm?.removeView(it) } } catch (_: Exception) {}
        try { coordView?.let { wm?.removeView(it) } } catch (_: Exception) {}
        floatingBtn = null
        captureOverlay = null
        coordView = null
    }

    override fun onDestroy() {
        removeAll()
        super.onDestroy()
    }
}
