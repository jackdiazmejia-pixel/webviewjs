    // ---------- dialogs ----------

    private fun showCreateFlowDialog() {
        val et = edit("Nombre del flujo", "Gemini")
        MaterialAlertDialogBuilder(this)
            .setTitle("Nuevo flujo")
            .setView(et.apply { setPadding(dp(16), dp(8), dp(16), dp(8)) })
            .setPositiveButton("Crear") { _, _ ->
                val name = et.text.toString().ifBlank { "Flujo ${flows.size + 1}" }
                val flow = Flow(name = name)
                flows.add(flow)
                saveFlows()
                currentFlowId = flow.id
                buildUi()
            }
            .setNegativeButton("Cancelar", null)
            .show()
    }

    private fun showFlowMenu(flow: Flow, anchor: View) {
        val options = arrayOf("Renombrar", "Duplicar", "Borrar")
        MaterialAlertDialogBuilder(this)
            .setTitle(flow.name)
            .setItems(options) { _, which ->
                when (which) {
                    0 -> {
                        val et = edit("Nombre", flow.name)
                        MaterialAlertDialogBuilder(this).setTitle("Renombrar").setView(et).setPositiveButton("Guardar") { _, _ ->
                            flow.name = et.text.toString().ifBlank { flow.name }
                            saveFlows()
                            buildUi()
                        }.setNegativeButton("Cancelar", null).show()
                    }
                    1 -> {
                        val copy = flow.copy(id = java.util.UUID.randomUUID().toString(), name = flow.name + " copia", steps = flow.steps.map { it.copy(id = java.util.UUID.randomUUID().toString()) }.toMutableList())
                        flows.add(copy)
                        saveFlows()
                        buildUi()
                    }
                    2 -> {
                        MaterialAlertDialogBuilder(this).setTitle("Borrar ${flow.name}?").setPositiveButton("Borrar") { _, _ ->
                            flows.remove(flow)
                            saveFlows()
                            buildUi()
                        }.setNegativeButton("Cancelar", null).show()
                    }
                }
            }.show()
    }

    private fun showStepMenu(flow: Flow, step: Step, anchor: View) {
        val options = arrayOf("Editar", "Borrar", "Mover arriba", "Mover abajo")
        MaterialAlertDialogBuilder(this)
            .setTitle(step.label)
            .setItems(options) { _, which ->
                when (which) {
                    0 -> showEditStepDialog(flow, step)
                    1 -> {
                        flow.steps.remove(step)
                        saveFlows()
                        buildUi()
                    }
                    2 -> {
                        val idx = flow.steps.indexOf(step)
                        if (idx > 0) {
                            flow.steps.removeAt(idx)
                            flow.steps.add(idx - 1, step)
                            saveFlows()
                            buildUi()
                        }
                    }
                    3 -> {
                        val idx = flow.steps.indexOf(step)
                        if (idx < flow.steps.size - 1) {
                            flow.steps.removeAt(idx)
                            flow.steps.add(idx + 1, step)
                            saveFlows()
                            buildUi()
                        }
                    }
                }
            }.show()
    }

    private fun showAddTapDialog(flow: Flow, defaultLabel: String) {
        val lay = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(8), dp(16), dp(8)) }
        val etLabel = edit("Etiqueta", defaultLabel)
        val etX = edit("X", "", numeric = true)
        val etY = edit("Y", "", numeric = true)
        lay.addView(label("Etiqueta")); lay.addView(etLabel)
        lay.addView(label("Coordenada X")); lay.addView(etX)
        lay.addView(label("Coordenada Y")); lay.addView(etY)
        MaterialAlertDialogBuilder(this).setTitle(defaultLabel).setView(lay).setPositiveButton("Agregar") { _, _ ->
            val x = etX.text.toString().toFloatOrNull()
            val y = etY.text.toString().toFloatOrNull()
            if (x == null || y == null) { toast("Faltan coordenadas"); return@setPositiveButton }
            flow.steps.add(Step(type = "TAP", label = etLabel.text.toString().ifBlank { defaultLabel }, x = x, y = y))
            saveFlows()
            buildUi()
        }.setNegativeButton("Cancelar", null).show()
    }

    private fun showAddPauseDialog(flow: Flow) {
        val lay = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(8), dp(16), dp(8)) }
        val etSec = edit("Segundos", "69", numeric = true)
        lay.addView(label("Segundos de espera")); lay.addView(etSec)
        MaterialAlertDialogBuilder(this).setTitle("Agregar Espera").setView(lay).setPositiveButton("Agregar") { _, _ ->
            val sec = etSec.text.toString().toIntOrNull() ?: 5
            flow.steps.add(Step(type = "PAUSE", label = "Esperar ${sec}s", seconds = sec))
            saveFlows()
            buildUi()
        }.setNegativeButton("Cancelar", null).show()
    }

    private fun showAddDownloadDialog(flow: Flow) {
        val lay = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(8), dp(16), dp(8)) }
        val etX = edit("X", "", numeric = true)
        val etY = edit("Y", "", numeric = true)
        lay.addView(label("Coordenada X del boton descargar")); lay.addView(etX)
        lay.addView(label("Coordenada Y")); lay.addView(etY)
        MaterialAlertDialogBuilder(this).setTitle("Descargar y Renombrar").setView(lay).setPositiveButton("Agregar") { _, _ ->
            val x = etX.text.toString().toFloatOrNull()
            val y = etY.text.toString().toFloatOrNull()
            if (x == null || y == null) { toast("Faltan coordenadas"); return@setPositiveButton }
            flow.steps.add(Step(type = "DOWNLOAD_RENAME", label = "Descargar y Renombrar a numero", x = x, y = y))
            saveFlows()
            buildUi()
        }.setNegativeButton("Cancelar", null).show()
    }

    private fun showEditStepDialog(flow: Flow, step: Step) {
        if (step.type == "WRITE_PROMPT") {
            toast("Este paso no necesita edicion")
            return
        }
        val lay = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(dp(16), dp(8), dp(16), dp(8)) }
        val etLabel = edit("Etiqueta", step.label)
        val etX = edit("X", step.x?.toString() ?: "", numeric = true)
        val etY = edit("Y", step.y?.toString() ?: "", numeric = true)
        val etSec = edit("Segundos", step.seconds?.toString() ?: "", numeric = true)
        lay.addView(label("Etiqueta")); lay.addView(etLabel)
        if (step.type == "TAP" || step.type == "DOWNLOAD_RENAME") {
            lay.addView(label("X")); lay.addView(etX)
            lay.addView(label("Y")); lay.addView(etY)
        }
        if (step.type == "PAUSE") {
            lay.addView(label("Segundos")); lay.addView(etSec)
        }
        MaterialAlertDialogBuilder(this).setTitle("Editar paso").setView(lay).setPositiveButton("Guardar") { _, _ ->
            val idx = flow.steps.indexOf(step)
            if (idx >= 0) {
                val newStep = step.copy(
                    label = etLabel.text.toString().ifBlank { step.label },
                    x = etX.text.toString().toFloatOrNull() ?: step.x,
                    y = etY.text.toString().toFloatOrNull() ?: step.y,
                    seconds = etSec.text.toString().toIntOrNull() ?: step.seconds
                )
                flow.steps[idx] = newStep
                saveFlows()
                buildUi()
            }
        }.setNegativeButton("Cancelar", null).show()
    }

    // ---------- permisos y ejecucion ----------

    private fun hasStorage(): Boolean =
        if (Build.VERSION.SDK_INT >= 30) Environment.isExternalStorageManager()
        else checkSelfPermission(Manifest.permission.WRITE_EXTERNAL_STORAGE) == PackageManager.PERMISSION_GRANTED

    private fun askStorage() {
        if (Build.VERSION.SDK_INT >= 30) {
            try {
                startActivity(Intent(Settings.ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION, Uri.parse("package:$packageName")))
            } catch (e: Exception) {
                startActivity(Intent(Settings.ACTION_MANAGE_ALL_FILES_ACCESS_PERMISSION))
            }
        } else {
            requestPermissions(arrayOf(Manifest.permission.WRITE_EXTERNAL_STORAGE, Manifest.permission.READ_EXTERNAL_STORAGE), 1)
        }
    }

    private fun askAccessibility() {
        startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
    }

    private fun showLog() {
        val tv = TextView(this).apply {
            text = Logger.read().ifEmpty { "(vacio)" }
            setTextColor(Color.WHITE)
            textSize = 12f
            setPadding(dp(12), dp(12), dp(12), dp(12))
            setTextIsSelectable(true)
        }
        val sv = ScrollView(this).apply {
            setBackgroundColor(Color.parseColor("#121212"))
            addView(tv)
        }
        MaterialAlertDialogBuilder(this)
            .setTitle("Registro")
            .setView(sv)
            .setPositiveButton("Cerrar", null)
            .setNeutralButton("Copiar") { _, _ ->
                val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                cm.setPrimaryClip(ClipData.newPlainText("registro", Logger.read()))
                toast("Copiado")
            }
            .setNegativeButton("Borrar") { _, _ -> Logger.clear() }
            .show()
    }

    private fun executeFlow(flow: Flow) {
        saveFlows()
        val svc = ClickService.instance
        if (svc == null) {
            toast("Primero activa accesibilidad")
            askAccessibility()
            return
        }
        if (!hasStorage()) {
            toast("Falta permiso de archivos")
            askStorage()
            return
        }
        if (flow.steps.isEmpty()) {
            toast("El flujo no tiene pasos")
            return
        }
        if (parseCount(flow.promptsRaw) == 0) {
            toast("Lista de prompts vacia (usa: 1. texto)")
            return
        }
        if (!File(flow.folder).isDirectory) {
            toast("Carpeta no existe: ${flow.folder}")
            return
        }
        svc.startFlow(flow)
        if (flow.useFloatingButton) {
            toast("Flujo ${flow.name}: boton flotante ▶ creado. Abre Gemini y dale a PLAY")
        } else {
            toast("Flujo ${flow.name} empieza en ${flow.waitBeforeStart}s. Abre Gemini.")
        }
        moveTaskToBack(true)
    }

    private fun parseCount(text: String): Int {
        val re = Regex("^\\s*(\\d+)\\s*\\.\\s*(.*)$")
        var c = 0
        var num = -1
        for (line in text.lines()) {
            val m = re.find(line)
            if (m != null) {
                if (num >= 0) c++
                num = m.groupValues[1].toIntOrNull() ?: -1
            }
        }
        if (num >= 0) c++
        return c
    }

    private fun toast(m: String) = Toast.makeText(this, m, Toast.LENGTH_LONG).show()
}

