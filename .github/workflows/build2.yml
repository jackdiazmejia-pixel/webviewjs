package com.autoprompter

import android.accessibilityservice.AccessibilityService
import android.accessibilityservice.GestureDescription
import android.content.ClipData
import android.content.ClipboardManager
import android.content.Intent
import android.graphics.Color
import android.graphics.Path
import android.graphics.PixelFormat
import android.os.Bundle
import android.os.Handler
import android.os.Looper
import android.util.Log
import android.view.Gravity
import android.view.View
import android.view.WindowManager
import android.view.accessibility.AccessibilityEvent
import android.view.accessibility.AccessibilityNodeInfo
import android.widget.Button
import android.widget.Toast
import java.io.File
import java.util.concurrent.CountDownLatch
import java.util.concurrent.TimeUnit
import java.util.concurrent.atomic.AtomicBoolean

class ClickService : AccessibilityService() {

    companion object {
        @Volatile
        var instance: ClickService? = null
    }

    private val main = Handler(Looper.getMainLooper())
    @Volatile private var running = false
    private var worker: Thread? = null
    private var overlay: View? = null
    private var currentFlow: Flow? = null

    override fun onServiceConnected() {
        super.onServiceConnected()
        Logger.init(this)
        instance = this
        Logger.log("Servicio de accesibilidad conectado")
    }

    override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
    override fun onInterrupt() {}

    override fun onUnbind(intent: Intent?): Boolean {
        stopRun("Servicio desconectado")
        instance = null
        return super.onUnbind(intent)
    }

    // ---------- API publica ----------

    fun startFlow(flow: Flow) {
        if (running) {
            toast("Ya hay un flujo corriendo")
            return
        }
        currentFlow = flow
        running = true
        if (flow.useFloatingButton) {
            showPlayOverlay(flow)
        } else {
            showStopOverlay()
            worker = Thread { runJob(flow) }.also { it.start() }
        }
    }

    fun stopRun(reason: String) {
        if (running) {
            running = false
            Logger.log(reason)
        }
        hideOverlay()
        worker?.interrupt()
        currentFlow = null
    }

    // ---------- job ----------

    private fun runJob(flow: Flow) {
        try {
            val prompts = parsePrompts(flow.promptsRaw).filter { it.num >= flow.startFrom }
            if (prompts.isEmpty()) {
                Logger.log("Lista vacia o mal formada")
                stopRun("Lista vacia")
                return
            }
            if (!flow.useFloatingButton) {
                Logger.log("INICIO flujo ${flow.name}: ${prompts.size} prompts, esperando ${flow.waitBeforeStart}s para que abras la app")
                if (!pause(flow.waitBeforeStart * 1000L)) return
            } else {
                Logger.log("INICIO flujo ${flow.name}: ${prompts.size} prompts (iniciado desde boton flotante)")
                if (!pause(500)) return
            }

            for (p in prompts) {
                if (!running) break
                Logger.log("--- Prompt ${p.num}: ${p.text.take(60)} ---")
                if (!processOne(flow, p)) {
                    stopRun("DETENIDO en prompt ${p.num}")
                    toast("Detenido en prompt ${p.num}")
                    return
                }
            }
            if (running) {
                stopRun("TERMINADO flujo ${flow.name}")
                toast("Flujo terminado")
            }
        } catch (e: Throwable) {
            Logger.log("ERROR: ${Log.getStackTraceString(e)}")
            stopRun("Error")
        }
    }

    private fun processOne(flow: Flow, prompt: Prompt): Boolean {
        for (step in flow.steps) {
            if (!running) return false
            Logger.log("Paso: ${step.label}")
            when (step.type) {
                "TAP" -> {
                    if (step.x == null || step.y == null) {
                        Logger.log("Paso TAP sin coordenadas: ${step.label}")
                        return false
                    }
                    if (!tap(step.x, step.y)) {
                        Logger.log("Fallo TAP ${step.label} en ${step.x},${step.y}")
                        return false
                    }
                    if (!pause(800)) return false
                }
                "WRITE_PROMPT" -> {
                    var ok = false
                    for (i in 1..3) {
                        if (insertText(prompt.text)) { ok = true; break }
                        if (!pause(600)) return false
                    }
                    if (!ok) {
                        Logger.log("No se pudo escribir prompt")
                        return false
                    }
                    if (!pause(600)) return false
                }
                "PAUSE" -> {
                    val sec = step.seconds ?: 5
                    Logger.log("Pausa ${sec}s")
                    if (!pause(sec * 1000L)) return false
                }
                "DOWNLOAD_RENAME" -> {
                    val folder = flow.folder
                    val before = snapshot(folder)
                    if (step.x != null && step.y != null) {
                        if (!tap(step.x, step.y)) {
                            Logger.log("Fallo TAP descargar ${step.x},${step.y}")
                            return false
                        }
                    }
                    Logger.log("Esperando archivo nuevo en $folder")
                    val nuevo = waitNewFile(folder, before)
                    if (nuevo == null) {
                        Logger.log("AVISO: no aparecio archivo nuevo")
                    } else {
                        renameFile(nuevo, prompt.num)
                    }
                    if (!pause(1200)) return false
                }
            }
        }
        return true
    }

    // ---------- acciones basicas ----------

    private fun tap(x: Float, y: Float): Boolean {
        val path = Path().apply { moveTo(x, y) }
        val gesture = GestureDescription.Builder()
            .addStroke(GestureDescription.StrokeDescription(path, 0, 60))
            .build()
        val latch = CountDownLatch(1)
        val ok = AtomicBoolean(false)
        val accepted = dispatchGesture(gesture, object : GestureResultCallback() {
            override fun onCompleted(g: GestureDescription?) { ok.set(true); latch.countDown() }
            override fun onCancelled(g: GestureDescription?) { latch.countDown() }
        }, main)
        if (!accepted) return false
        latch.await(3, TimeUnit.SECONDS)
        return ok.get()
    }

    private fun insertText(text: String): Boolean {
        val root = rootInActiveWindow ?: return false
        val node = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: return false
        val args = Bundle().apply {
            putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
        }
        if (node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) return true
        val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
        cm.setPrimaryClip(ClipData.newPlainText("prompt", text))
        return node.performAction(AccessibilityNodeInfo.ACTION_PASTE)
    }

    private fun snapshot(folder: String): Set<String> =
        File(folder).listFiles()?.map { it.absolutePath }?.toSet() ?: emptySet()

    private fun isTemp(name: String): Boolean {
        val n = name.lowercase()
        return n.startsWith(".") || n.endsWith(".crdownload") || n.endsWith(".tmp") ||
            n.endsWith(".part") || n.endsWith(".partial") || n.endsWith(".download")
    }

    private fun waitNewFile(folder: String, before: Set<String>): File? {
        for (i in 1..30) {
            if (!pause(1000)) return null
            val cand = File(folder).listFiles()
                ?.filter { it.isFile && it.absolutePath !in before && !isTemp(it.name) }
                ?.maxByOrNull { it.lastModified() }
            if (cand != null) {
                val size = cand.length()
                if (!pause(1500)) return null
                if (cand.exists() && cand.length() == size) return cand
            }
        }
        return null
    }

    private fun renameFile(f: File, num: Int) {
        val ext = f.extension
        val base = num.toString()
        fun name(suffix: String) = if (ext.isEmpty()) "$base$suffix" else "$base$suffix.$ext"
        var target = File(f.parentFile, name(""))
        var i = 1
        while (target.exists()) {
            target = File(f.parentFile, name("_$i"))
            i++
        }
        if (f.renameTo(target)) {
            Logger.log("Guardado como ${target.name}")
        } else {
            Logger.log("No se pudo renombrar ${f.name} a ${target.name}")
        }
    }

    private fun pause(ms: Long): Boolean {
        var left = ms
        try {
            while (left > 0 && running) {
                val s = minOf(200L, left)
                Thread.sleep(s)
                left -= s
            }
        } catch (e: InterruptedException) {
            return false
        }
        return running
    }

    private fun toast(msg: String) {
        main.post { Toast.makeText(applicationContext, msg, Toast.LENGTH_LONG).show() }
    }

    private fun parsePrompts(text: String): List<Prompt> {
        val re = Regex("^\\s*(\\d+)\\s*\\.\\s*(.*)$")
        val out = mutableListOf<Prompt>()
        var num = -1
        val sb = StringBuilder()
        fun flush() {
            if (num >= 0 && sb.isNotBlank()) out.add(Prompt(num, sb.toString().trim()))
            sb.setLength(0)
        }
        for (line in text.lines()) {
            val m = re.find(line)
            if (m != null) {
                flush()
                num = m.groupValues[1].toIntOrNull() ?: -1
                sb.append(m.groupValues[2])
            } else if (line.isNotBlank() && num >= 0) {
                sb.append(' ').append(line.trim())
            }
        }
        flush()
        return out
    }

    // ---------- overlays ----------

    private fun showPlayOverlay(flow: Flow) {
        main.post {
            hideOverlay()
            val b = Button(this).apply {
                text = "▶ ${flow.name.take(12)}"
                textSize = 12f
                setTextColor(Color.WHITE)
                setBackgroundColor(0xFF2E7D32.toInt())
                setPadding(24, 16, 24, 16)
                setOnClickListener {
                    hideOverlay()
                    showStopOverlay()
                    worker = Thread { runJob(flow) }.also { it.start() }
                }
            }
            val lp = WindowManager.LayoutParams(
                WindowManager.LayoutParams.WRAP_CONTENT,
                WindowManager.LayoutParams.WRAP_CONTENT,
                WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                PixelFormat.TRANSLUCENT
            ).apply { gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; y = 100 }
            try {
                (getSystemService(WINDOW_SERVICE) as WindowManager).addView(b, lp)
                overlay = b
            } catch (e: Exception) {
                Logger.log("No se pudo mostrar boton PLAY: ${e.message}")
            }
        }
    }

    private fun showStopOverlay() {
        main.post {
            if (overlay != null) return@post
            val b = Button(this).apply {
                text = "■ STOP"
                textSize = 12f
                setTextColor(Color.WHITE)
                setBackgroundColor(0xCCB00020.toInt())
                setOnClickListener { stopRun("Detenido por usuario") }
            }
            val lp = WindowManager.LayoutParams(
                WindowManager.LayoutParams.WRAP_CONTENT,
                WindowManager.LayoutParams.WRAP_CONTENT,
                WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                PixelFormat.TRANSLUCENT
            ).apply { gravity = Gravity.TOP or Gravity.END }
            try {
                (getSystemService(WINDOW_SERVICE) as WindowManager).addView(b, lp)
                overlay = b
            } catch (e: Exception) {
                Logger.log("No se pudo mostrar STOP: ${e.message}")
            }
        }
    }

    private fun hideOverlay() {
        main.post {
            overlay?.let {
                try { (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(it) } catch (_: Exception) {}
            }
            overlay = null
        }
    }
}

