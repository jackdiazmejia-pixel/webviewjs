package com.autoprompter

import android.Manifest
import android.app.AlertDialog
import android.content.ClipData
import android.content.ClipboardManager
import android.content.Intent
import android.content.SharedPreferences
import android.content.pm.PackageManager
import android.graphics.Color
import android.graphics.drawable.ColorDrawable
import android.graphics.drawable.GradientDrawable
import android.net.Uri
import android.os.Build
import android.os.Bundle
import android.os.Environment
import android.provider.Settings
import android.text.InputType
import android.util.Log
import android.view.Gravity
import android.view.View
import android.view.ViewGroup
import android.widget.Button
import android.widget.CheckBox
import android.widget.EditText
import android.widget.HorizontalScrollView
import android.widget.ImageButton
import android.widget.LinearLayout
import android.widget.ScrollView
import android.widget.TextView
import android.widget.Toast
import androidx.appcompat.app.AppCompatActivity
import androidx.core.content.ContextCompat
import com.google.android.material.button.MaterialButton
import com.google.android.material.card.MaterialCardView
import com.google.android.material.dialog.MaterialAlertDialogBuilder
import com.google.gson.Gson
import com.google.gson.reflect.TypeToken
import java.io.File

class MainActivity : AppCompatActivity() {

    private lateinit var prefs: SharedPreferences
    private val gson = Gson()
    private var flows: MutableList<Flow> = mutableListOf()
    private var currentFlowId: String? = null

    // UI refs
    private lateinit var rootContainer: LinearLayout

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        Logger.init(this)
        val old = Thread.getDefaultUncaughtExceptionHandler()
        Thread.setDefaultUncaughtExceptionHandler { t, e ->
            Logger.log("CRASH: ${Log.getStackTraceString(e)}")
            old?.uncaughtException(t, e)
        }
        prefs = getSharedPreferences("flows_v2", MODE_PRIVATE)
        loadFlows()
        buildUi()
    }

    override fun onPause() {
        super.onPause()
        saveFlows()
    }

    // ---------- persistencia ----------

    private fun saveFlows() {
        try {
            prefs.edit().putString("flows_json", gson.toJson(flows)).apply()
        } catch (_: Exception) {}
    }

    private fun loadFlows() {
        try {
            val json = prefs.getString("flows_json", null)
            if (json != null) {
                val type = object : TypeToken<MutableList<Flow>>() {}.type
                flows = gson.fromJson(json, type) ?: mutableListOf()
            }
        } catch (e: Exception) {
            flows = mutableListOf()
        }
        if (flows.isEmpty()) {
            // migrar del viejo si existe
            val oldPrefs = getSharedPreferences("cfg", MODE_PRIVATE)
            val oldPrompts = oldPrefs.getString("prompts", "")
            if (!oldPrompts.isNullOrEmpty()) {
                val f = Flow(name = "Mi primer flujo", promptsRaw = oldPrompts)
                f.folder = oldPrefs.getString("folder", Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS).absolutePath) ?: "/storage/emulated/0/Download"
                f.startFrom = oldPrefs.getString("from", "1")?.toIntOrNull() ?: 1
                // crear pasos del viejo config
                val tx = oldPrefs.getString("tx", "")?.toFloatOrNull()
                val ty = oldPrefs.getString("ty", "")?.toFloatOrNull()
                val sx = oldPrefs.getString("sx", "")?.toFloatOrNull()
                val sy = oldPrefs.getString("sy", "")?.toFloatOrNull()
                val dx = oldPrefs.getString("dx", "")?.toFloatOrNull()
                val dy = oldPrefs.getString("dy", "")?.toFloatOrNull()
                val wait = oldPrefs.getString("wait", "60")?.toIntOrNull() ?: 60
                if (tx != null && ty != null) f.steps.add(Step(type = "TAP", label = "Tocar Textarea", x = tx, y = ty))
                f.steps.add(Step(type = "WRITE_PROMPT", label = "Escribir Prompt"))
                if (sx != null && sy != null) f.steps.add(Step(type = "TAP", label = "Tocar Enviar", x = sx, y = sy))
                f.steps.add(Step(type = "PAUSE", label = "Esperar generacion", seconds = wait))
                if (dx != null && dy != null) f.steps.add(Step(type = "DOWNLOAD_RENAME", label = "Descargar y Renombrar", x = dx, y = dy))
                flows.add(f)
                saveFlows()
            }
        }
    }

    // ---------- helpers UI ----------

    private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

    private fun bgRounded(color: Int, radius: Int = 16): GradientDrawable {
        return GradientDrawable().apply {
            setColor(color)
            cornerRadius = dp(radius).toFloat()
        }
    }

    private fun card(): MaterialCardView {
        return MaterialCardView(this).apply {
            radius = dp(16).toFloat()
            cardElevation = dp(2).toFloat()
            setCardBackgroundColor(Color.parseColor("#1E1E1E"))
            strokeWidth = 0
            val p = dp(12)
            setContentPadding(p, p, p, p)
            layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply {
                setMargins(0, 0, 0, dp(12))
            }
        }
    }

    private fun label(text: String, size: Float = 13f, color: Int = Color.parseColor("#AAAAAA")): TextView {
        return TextView(this).apply {
            this.text = text
            textSize = size
            setTextColor(color)
            setPadding(0, dp(6), 0, dp(4))
        }
    }

    private fun title(text: String): TextView {
        return TextView(this).apply {
            this.text = text
            textSize = 16f
            setTextColor(Color.WHITE)
            setTypeface(null, android.graphics.Typeface.BOLD)
        }
    }

    private fun edit(hint: String, text: String = "", multi: Boolean = false, numeric: Boolean = false): EditText {
        return EditText(this).apply {
            this.hint = hint
            setText(text)
            setHintTextColor(Color.parseColor("#666666"))
            setTextColor(Color.WHITE)
            background = bgRounded(Color.parseColor("#2A2A2A"), 10)
            setPadding(dp(14), dp(12), dp(14), dp(12))
            if (numeric) inputType = InputType.TYPE_CLASS_NUMBER
            else if (multi) {
                inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
                minLines = 6
                gravity = Gravity.TOP
            } else {
                inputType = InputType.TYPE_CLASS_TEXT
            }
        }
    }

    private fun mButton(text: String, bgColor: Int = Color.parseColor("#2A2A2A"), icon: String = ""): MaterialButton {
        return MaterialButton(this).apply {
            this.text = if (icon.isNotEmpty()) "$icon $text" else text
            setBackgroundColor(bgColor)
            setTextColor(Color.WHITE)
            cornerRadius = dp(12)
            setPadding(dp(16), dp(12), dp(16), dp(12))
        }
    }

    // ---------- UI principal ----------

    private fun buildUi() {
        rootContainer = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setBackgroundColor(Color.parseColor("#121212"))
        }
        val scroll = ScrollView(this).apply {
            setBackgroundColor(Color.parseColor("#121212"))
            addView(rootContainer)
        }
        setContentView(scroll)

        if (currentFlowId == null) {
            buildFlowList()
        } else {
            val flow = flows.find { it.id == currentFlowId }
            if (flow != null) buildFlowDetail(flow) else buildFlowList()
        }
    }

    private fun buildFlowList() {
        rootContainer.removeAllViews()
        rootContainer.setPadding(dp(16), dp(16), dp(16), dp(32))

        // Header
        val header = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
        header.addView(TextView(this).apply {
            text = "AutoPrompter 2.0"
            textSize = 24f
            setTextColor(Color.WHITE)
            setTypeface(null, android.graphics.Typeface.BOLD)
        })
        header.addView(label("Flujos de automatizacion - toca un flujo para editarlo", 12f))
        rootContainer.addView(header)
        rootContainer.addView(View(this).apply { layoutParams = LinearLayout.LayoutParams(-1, dp(16)) })

        // Permisos
        val permCard = card()
        val permLay = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
        permLay.addView(title("Estado"))
        val hasStorage = hasStorage()
        val hasAcc = ClickService.instance != null
        permLay.addView(label("Archivos: ${if (hasStorage) "✅ OK" else "❌ Falta"} | Accesibilidad: ${if (hasAcc) "✅ OK" else "❌ Falta"}", 12f, if (hasStorage && hasAcc) Color.parseColor("#81C784") else Color.parseColor("#EF9A9A")))
        val rowPerm = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
        rowPerm.addView(mButton("Archivos", Color.parseColor("#333333")).apply {
