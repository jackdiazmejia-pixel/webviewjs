package com.autoprompter

import android.content.Context
import java.io.File
import java.text.SimpleDateFormat
import java.util.Date
import java.util.Locale

object Logger {
    private lateinit var file: File

    fun init(ctx: Context) {
        if (!::file.isInitialized) {
            file = File(ctx.applicationContext.filesDir, "registro.txt")
        }
    }

    @Synchronized
    fun log(msg: String) {
        if (!::file.isInitialized) return
        try {
            val t = SimpleDateFormat("dd/MM HH:mm:ss", Locale.US).format(Date())
            file.appendText("$t  $msg\n")
            if (file.length() > 300_000) {
                file.writeText(file.readText().takeLast(100_000))
            }
        } catch (_: Exception) {
        }
    }

    @Synchronized
    fun read(): String {
        if (!::file.isInitialized) return ""
        return try { if (file.exists()) file.readText() else "" } catch (_: Exception) { "" }
    }

    @Synchronized
    fun clear() {
        if (!::file.isInitialized) return
        try { file.writeText("") } catch (_: Exception) {}
    }
}

