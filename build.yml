              val tx: Float, val ty: Float,   // campo de texto
              val sx: Float, val sy: Float,   // botón enviar
              val dx: Float, val dy: Float,   // botón descargar
              val waitSec: Int,
              val folder: String,
              val startFrom: Int
          )
