name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Aceptar licencias Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Generar proyecto
        run: |
          cat > settings.gradle.kts <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "WebViewJS"
          include(":app")
          EOF_0
          cat > build.gradle.kts <<'EOF_1'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_1
          cat > gradle.properties <<'EOF_2'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          EOF_2
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.webviewjs"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.webviewjs"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="WebView JS"
                  android:theme="@style/Theme.App"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF_5'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.App" parent="Theme.AppCompat.Light.NoActionBar" />
          </resources>
          EOF_5
          mkdir -p app/src/main/java/com/example/webviewjs
          cat > app/src/main/java/com/example/webviewjs/MainActivity.kt <<'EOF_6'
          package com.example.webviewjs

          import android.annotation.SuppressLint
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Bundle
          import android.os.Message
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.EditorInfo
          import android.webkit.CookieManager
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.LinearLayout
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONArray
          import org.json.JSONObject
          import org.json.JSONTokener

          class MainActivity : AppCompatActivity() {

              private lateinit var container: FrameLayout
              private lateinit var urlBar: EditText
              private lateinit var progress: ProgressBar
              private val stack = mutableListOf<WebView>() // [0] = principal, el resto = popups
              private val current get() = stack.last()
              private val prefs by lazy { getSharedPreferences("scripts", MODE_PRIVATE) }

              private fun dp(n: Int) = (n * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      fitsSystemWindows = true
                  }
                  val bar = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  urlBar = EditText(this).apply {
                      setSingleLine()
                      hint = "URL o búsqueda"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                      imeOptions = EditorInfo.IME_ACTION_GO
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                      setOnEditorActionListener { _, id, _ ->
                          if (id == EditorInfo.IME_ACTION_GO) { go(text.toString()); true } else false
                      }
                  }
                  val goBtn = Button(this).apply { text = "Ir"; setOnClickListener { go(urlBar.text.toString()) } }
                  val menuBtn = Button(this).apply { text = "⋮"; setOnClickListener { showMenu() } }
                  bar.addView(urlBar); bar.addView(goBtn); bar.addView(menuBtn)

                  progress = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal).apply {
                      max = 100
                      visibility = View.GONE
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(3))
                  }
                  container = FrameLayout(this)

                  root.addView(bar)
                  root.addView(progress)
                  root.addView(container, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f))
                  setContentView(root)

                  val main = newWebView()
                  container.addView(main)
                  stack.add(main)
                  main.loadUrl("https://mail.google.com")

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          when {
                              current.canGoBack() -> current.goBack()
                              stack.size > 1 -> closeWindow(current)
                              else -> { isEnabled = false; onBackPressedDispatcher.onBackPressed() }
                          }
                      }
                  })
              }

              override fun onPause() {
                  super.onPause()
                  CookieManager.getInstance().flush()
              }

              // ---------------- WebView ----------------

              @SuppressLint("SetJavaScriptEnabled")
              private fun newWebView(): WebView {
                  val w = WebView(this)
                  w.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      javaScriptCanOpenWindowsAutomatically = true
                      setSupportMultipleWindows(true) // popups (login con Google, etc.)
                      mediaPlaybackRequiresUserGesture = false
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      setSupportZoom(true)
                      builtInZoomControls = true
                      displayZoomControls = false
                      // Quita las marcas de WebView para que Google lo trate como navegador normal
                      userAgentString = userAgentString
                          .replace("; wv", "")
                          .replace(Regex("Version/\\d+\\.\\d+ "), "")
                  }
                  CookieManager.getInstance().setAcceptCookie(true)
                  CookieManager.getInstance().setAcceptThirdPartyCookies(w, true)

                  w.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView, url: String?) {
                          if (view === current) urlBar.setText(url ?: "")
                          if (url != null) runAutoScripts(view, url)
                      }
                  }
                  w.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView, p: Int) {
                          progress.progress = p
                          progress.visibility = if (p < 100) View.VISIBLE else View.GONE
                      }

                      override fun onCreateWindow(
                          view: WebView, isDialog: Boolean, isUserGesture: Boolean, resultMsg: Message
                      ): Boolean {
                          val popup = newWebView()
                          container.addView(popup)
                          stack.add(popup)
                          (resultMsg.obj as WebView.WebViewTransport).webView = popup
                          resultMsg.sendToTarget()
                          return true
                      }

                      override fun onCloseWindow(window: WebView) = closeWindow(window)
                  }
                  return w
              }

              private fun closeWindow(w: WebView) {
                  if (w === stack[0]) return
                  container.removeView(w)
                  stack.remove(w)
                  w.destroy()
                  urlBar.setText(current.url ?: "")
              }

              private fun go(input: String) {
                  val t = input.trim()
                  if (t.isEmpty()) return
                  val url = when {
                      t.contains("://") -> t
                      t.contains(".") && !t.contains(" ") -> "https://$t"
                      else -> "https://www.google.com/search?q=" + Uri.encode(t)
                  }
                  current.loadUrl(url)
              }

              // ---------------- Scripts ----------------

              private fun loadScripts() = JSONArray(prefs.getString("list", "[]"))
              private fun saveScripts(a: JSONArray) = prefs.edit().putString("list", a.toString()).apply()

              private fun matches(pattern: String, url: String): Boolean {
                  val p = pattern.trim().ifEmpty { "*" }
                  val rx = p.split("*").joinToString(".*") { Regex.escape(it) }
                  return Regex(rx).matches(url)
              }

              private fun runAutoScripts(view: WebView, url: String) {
                  val list = loadScripts()
                  for (i in 0 until list.length()) {
                      val s = list.getJSONObject(i)
                      if (s.getBoolean("enabled") && matches(s.getString("match"), url)) {
                          view.evaluateJavascript("(function(){\n${s.getString("code")}\n})();", null)
                      }
                  }
              }

              private fun scriptDialog(index: Int) {
                  val list = loadScripts()
                  val s = if (index >= 0) list.getJSONObject(index)
                  else JSONObject().put("name", "").put("match", "*").put("code", "").put("enabled", true)

                  val lay = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(10), dp(20), 0)
                  }
                  val name = EditText(this).apply { hint = "Nombre"; setText(s.getString("name")) }
                  val match = EditText(this).apply {
                      hint = "Páginas (ej: *://*.google.com/*)"
                      setText(s.getString("match"))
                  }
                  val code = EditText(this).apply {
                      hint = "Código JavaScript"
                      setText(s.getString("code"))
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE or
                          InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS
                      minLines = 8
                      gravity = Gravity.TOP
                      typeface = Typeface.MONOSPACE
                  }
                  lay.addView(name); lay.addView(match); lay.addView(code)

                  AlertDialog.Builder(this)
                      .setTitle(if (index >= 0) "Editar script" else "Nuevo script")
                      .setView(ScrollView(this).apply { addView(lay) })
                      .setPositiveButton("Guardar") { _, _ ->
                          s.put("name", name.text.toString().ifBlank { "Sin nombre" })
                          s.put("match", match.text.toString().ifBlank { "*" })
                          s.put("code", code.text.toString())
                          if (index >= 0) list.put(index, s) else list.put(s)
                          saveScripts(list)
                      }
                      .setNeutralButton("Ejecutar") { _, _ ->
                          current.evaluateJavascript(code.text.toString()) { r ->
                              if (r != null && r != "null") Toast.makeText(this, r, Toast.LENGTH_LONG).show()
                          }
                      }
                      .setNegativeButton("Cerrar", null)
                      .show()
              }

              private fun scriptsList() {
                  val list = loadScripts()
                  val names = Array(list.length()) { i ->
                      val s = list.getJSONObject(i)
                      (if (s.getBoolean("enabled")) "✅ " else "⬜ ") + s.getString("name")
                  }
                  AlertDialog.Builder(this)
                      .setTitle("Mis scripts")
                      .setItems(names) { _, i -> scriptActions(i) }
                      .setPositiveButton("Nuevo") { _, _ -> scriptDialog(-1) }
                      .setNegativeButton("Cerrar", null)
                      .show()
              }

              private fun scriptActions(i: Int) {
                  val list = loadScripts()
                  val s = list.getJSONObject(i)
                  AlertDialog.Builder(this)
                      .setTitle(s.getString("name"))
                      .setItems(arrayOf("Editar", "Activar / Desactivar", "Ejecutar ahora", "Borrar")) { _, which ->
                          when (which) {
                              0 -> scriptDialog(i)
                              1 -> { s.put("enabled", !s.getBoolean("enabled")); list.put(i, s); saveScripts(list); scriptsList() }
                              2 -> current.evaluateJavascript("(function(){\n${s.getString("code")}\n})();", null)
                              3 -> { list.remove(i); saveScripts(list); scriptsList() }
                          }
                      }
                      .show()
              }

              // ---------------- Inspector DOM ----------------

              private val treeJs = """
                  (function(){var out=[];function w(e,d){if(d>8||out.length>600)return;
                  var c=(typeof e.className==='string'&&e.className.trim())?'.'+e.className.trim().split(/\s+/).join('.'):'';
                  out.push('  '.repeat(d)+e.tagName.toLowerCase()+(e.id?'#'+e.id:'')+c);
                  for(var i=0;i<e.children.length;i++)w(e.children[i],d+1)}
                  w(document.documentElement,0);return out.join('\n')})()
              """.trimIndent()

              private fun showJsText(title: String, js: String) {
                  current.evaluateJavascript(js) { r ->
                      val content = (JSONTokener(r ?: "null").nextValue() as? String) ?: "(sin resultado)"
                      val tv = TextView(this).apply {
                          text = content
                          setTextIsSelectable(true)
                          typeface = Typeface.MONOSPACE
                          textSize = 11f
                          setPadding(dp(16), dp(8), dp(16), dp(8))
                      }
                      AlertDialog.Builder(this)
                          .setTitle(title)
                          .setView(ScrollView(this).apply { addView(tv) })
                          .setPositiveButton("Cerrar", null)
                          .show()
                  }
              }

              // ---------------- Menú ----------------

              private fun showMenu() {
                  val items = arrayOf(
                      "Ejecutar JavaScript", "Mis scripts", "Árbol DOM", "Ver HTML",
                      "Recargar", "Borrar cookies"
                  )
                  AlertDialog.Builder(this).setItems(items) { _, i ->
                      when (i) {
                          0 -> scriptDialog(-1)
                          1 -> scriptsList()
                          2 -> showJsText("Árbol DOM", treeJs)
                          3 -> showJsText("HTML", "document.documentElement.outerHTML.slice(0,60000)")
                          4 -> current.reload()
                          5 -> CookieManager.getInstance().removeAllCookies {
                              Toast.makeText(this, "Cookies borradas", Toast.LENGTH_SHORT).show()
                          }
                      }
                  }.show()
              }
          }
          EOF_6

      - name: Compilar
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
